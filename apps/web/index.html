<!doctype html>
<html lang="en" data-theme="dark" data-skin="studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitMax" />
    <meta name="description" content="FitMax: an AI coach that counts your reps and fixes your form in real time." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>FitMax</title>
    <script>
      try { const d = document.documentElement; d.dataset.skin = localStorage.getItem('fitmax.skin') || 'studio'; const t = localStorage.getItem('fitmax.theme'); if (t) d.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
